<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>AshBound — боковой цикл v1</title>
<style>
body{background:#20262b;color:#e9e1d1;font:18px system-ui;margin:30px;max-width:1100px}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
figure{margin:10px;padding:15px;background:#66625b}
canvas{width:min(100%,384px)}button{font:inherit;margin:6px;padding:10px}a{color:#ddc58a}
</style>
<h1>Боковой цикл v1</h1>
<p>8 поз, 15 поз/с. Оба шага, противофаза рук, общая база ±рюкзак. Страница работает из файлов игры без сервера. Просмотр здесь не заменяет проверку в игре.</p>
<nav aria-label="Просмотр цикла">
<button id="normal">Обычный темп</button><button id="slow">Медленно ×¼</button>
<button id="pause">Пауза</button><button id="next">Следующая поза</button><button id="flip">Развернуть</button>
</nav>
<p id="status" role="status">Загрузка атласов…</p>
<main>
<figure><figcaption>Ходьба, без рюкзака</figcaption><canvas width="384" height="384" data-atlas="walk-bare"></canvas></figure>
<figure><figcaption>Ходьба, с рюкзаком</figcaption><canvas width="384" height="384" data-atlas="walk-pack"></canvas></figure>
<figure><figcaption>Бег, без рюкзака</figcaption><canvas width="384" height="384" data-atlas="run-bare"></canvas></figure>
<figure><figcaption>Бег, с рюкзаком</figcaption><canvas width="384" height="384" data-atlas="run-pack"></canvas></figure>
</main>
<p><a href="../README.md">Исходники и правила сборки</a> · <a href="opposite-contacts.png">Противоположные контакты</a> · <a href="../../../../docs/art/side-gait-02/README.md">Сравнение и запись S23</a></p>
<script>
const status=document.querySelector('#status');
let frame=0,rate=15,playing=true,flipped=false,last=0,elapsed=0;
const panels=[...document.querySelectorAll('canvas')].map(canvas=>{
 const image=new Image();image.src='../../../../assets/characters/courtyard/side-gait-v1/'+canvas.dataset.atlas+'.png';
 return {canvas,image,context:canvas.getContext('2d')};
});
function render(){
 for(const {image,context:c} of panels){
  c.clearRect(0,0,384,384);c.save();if(flipped){c.translate(384,0);c.scale(-1,1);}
  c.drawImage(image,(frame%4)*384,Math.floor(frame/4)*384,384,384,0,0,384,384);c.restore();
 }
 status.textContent=`Поза ${frame}/7 · ${playing?rate+' поз/с':'пауза'} · ${flipped?'влево':'вправо'}`;
}
const control=(id,fn)=>document.querySelector('#'+id).onclick=()=>{fn();elapsed=0;render();};
control('normal',()=>{rate=15;playing=true;});
control('slow',()=>{rate=3.75;playing=true;});
control('pause',()=>{playing=!playing;});
control('next',()=>{playing=false;frame=(frame+1)%8;});
control('flip',()=>{flipped=!flipped;});
Promise.all(panels.map(({image})=>image.decode())).then(()=>{
 render();requestAnimationFrame(function tick(now){
  if(last&&playing){elapsed+=Math.min(now-last,250);if(elapsed>=1000/rate){frame=(frame+Math.floor(elapsed/(1000/rate)))%8;elapsed%=1000/rate;render();}}
  last=now;requestAnimationFrame(tick);
 });
}).catch(()=>{status.textContent='Не удалось загрузить игровые атласы. Откройте страницу внутри полного checkout AshBound.';});
</script>
</html>
